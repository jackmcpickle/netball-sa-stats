<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="title-c">
  <title id="title-c">Netball goal with ball</title>
  <!-- Ring/goal mark with a small seamed ball  sport-specific beyond the ball alone -->
  <g fill="none" stroke="#1f6feb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Goal ring -->
    <ellipse cx="15" cy="13.5" rx="11.2" ry="4.6"/>
    <!-- Net suggestion (three hanging lines) -->
    <path d="M5.5 14.2c.4 5.8 2.6 10.6 5.2 13.2"/>
    <path d="M15 18.1v9.4"/>
    <path d="M24.5 14.2c-.4 5.8-2.6 10.6-5.2 13.2"/>
  </g>
  <!-- Ball resting in / over the ring -->
  <circle cx="21.5" cy="8.2" r="6.2" fill="#1f6feb"/>
  <g fill="none" stroke="#fffaf0" stroke-width="1.15" stroke-linecap="round">
    <path d="M21.5 2.2c-1.5 1.9-1.5 10.1 0 12"/>
    <path d="M16.4 6.2c2.2-1.4 8-1.4 10.2 0"/>
    <path d="M16.4 10.4c2.2 1.3 8 1.3 10.2 0"/>
  </g>
</svg>
