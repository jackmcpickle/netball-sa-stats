<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="title-d">
  <title id="title-d">Netball segment mark</title>
  <!-- Bold geometric mark: four curved segments, high contrast at 26px -->
  <defs>
    <clipPath id="ball-clip">
      <circle cx="16" cy="16" r="14"/>
    </clipPath>
  </defs>
  <circle cx="16" cy="16" r="14" fill="#1f6feb"/>
  <g clip-path="url(#ball-clip)">
    <!-- Alternating paper segments via curved wedges -->
    <path fill="#fffaf0" d="M16 16 C10 6, 6 8, 2.2 11.2 L2.2 2.2 L16 2.2 Z"/>
    <path fill="#fffaf0" d="M16 16 C22 26, 26 24, 29.8 20.8 L29.8 29.8 L16 29.8 Z"/>
  </g>
  <!-- Seam overlay for ball readability -->
  <g fill="none" stroke="#1f6feb" stroke-width="1.35" stroke-linecap="round">
    <path d="M16 2.2c-3.1 4.1-3.1 23.5 0 27.6" opacity="0.35"/>
  </g>
  <circle cx="16" cy="16" r="14" fill="none" stroke="#1f6feb" stroke-width="1.2"/>
</svg>
